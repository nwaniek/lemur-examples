<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D animation</title>
<style>:root{--bg:#ffffff;--fg:#232629;--accent:#2e5e6e;--design-w:1920px}
/* Display runtime for build-time SVG decks: navigation, step reveals, and the
   slide overview (grid 'o' / sidebar 'O'). Colours come from the master via the
   --bg / --fg custom properties set inline by the emitter. */

html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden;
  font-family: system-ui, sans-serif; }

/* Slides are stacked (all present, positioned) so they can cross-fade or travel.
   `none` = instant cut (base rules, no transition); the deck's transition token
   is set on <body data-across=…> by the emitter. */
.slide { position: fixed; inset: 0; display: flex;
  align-items: center; justify-content: center; opacity: 0; visibility: hidden; }
.slide.is-current { opacity: 1; visibility: visible; z-index: 1; }
svg { width: 100%; height: 100%; display: block; }
[data-step] { transition: opacity .35s ease, transform .35s ease; }

/* A baked `!anim` holds its *final* frame — right for print / no-JS, but on
   screen it would flash before playback starts. Hide it on screen until the
   runtime has applied the current frame (it sets inline visibility then); print
   has no such rule, so the completed animation shows. */
@media screen { .lmr-anim { visibility: hidden; } }

/* -- across-slide transitions (data-across) -------------------------------- */
/* fade: cross-dissolve — both slides animate opacity together. */
body[data-across="fade"] .slide { transition: opacity .45s ease, visibility 0s .45s; }
body[data-across="fade"] .slide.is-current { transition: opacity .45s ease, visibility 0s; }
/* slide / push: the frame travels one viewport width. Only the current slide and
   the one just left (is-out) are visible; the rest stay hidden off-screen, so no
   slide flashes on load or piles up behind the crossing pair. */
body[data-across="slide"] .slide, body[data-across="push"] .slide {
  transition: transform .5s cubic-bezier(.4, 0, .2, 1); }
body[data-across="slide"] .slide.is-current, body[data-across="slide"] .slide.is-out,
body[data-across="push"] .slide.is-current, body[data-across="push"] .slide.is-out {
  opacity: 1; visibility: visible; }
body[data-across="slide"] .slide.is-before, body[data-across="push"] .slide.is-before { transform: translateX(-100%); }
body[data-across="slide"] .slide.is-after, body[data-across="push"] .slide.is-after { transform: translateX(100%); }
body[data-across="slide"] .slide.is-current, body[data-across="push"] .slide.is-current { transform: translateX(0); }
/* a jump of more than one slide cuts instead of animating (one reflow). */
body.no-anim .slide { transition: none !important; }
@media (prefers-reduced-motion: reduce) { .slide, [data-step] { transition: none !important; } }

/* progress bar (opt-in via !progress): scaleX tracks the deck position. */
#progress { position: fixed; left: 0; height: 5px; width: 100%; z-index: 30;
  transform-origin: left center; transform: scaleX(0); background: var(--accent);
  opacity: .5; pointer-events: none; transition: transform .3s ease; }
#progress.top { top: 0; }
#progress.bottom { bottom: 0; }

/* navigation wedges: triangles bottom-right, dimmed at the deck ends, Next cued
   in the accent colour while the current slide still has sub-steps to reveal */
#nav { position: fixed; right: 20px; bottom: 16px; z-index: 40;
  display: flex; gap: 8px; opacity: .4; transition: opacity .2s ease; }
#nav:hover { opacity: 1; }
.nav-btn { border: 0; cursor: pointer; font-size: 20px; line-height: 1;
  padding: 6px 10px; border-radius: 6px; color: var(--fg);
  background: color-mix(in srgb, var(--fg) 14%, transparent);
  transition: background .15s ease, opacity .15s ease; }
.nav-btn:hover { background: color-mix(in srgb, var(--fg) 26%, transparent); }
#nav.at-start .nav-prev, #nav.at-end .nav-next { opacity: .25; pointer-events: none; }
#nav[data-more="step"] .nav-next { background: var(--accent); color: var(--bg); }

/* --- overview (grid + sidebar) --------------------------------------------- */
:root { --sidebar-w: 340px; }
#ov { position: fixed; display: none; z-index: 50; overflow: auto;
  background: color-mix(in srgb, var(--bg) 82%, #000); }
#ov.grid { inset: 0; }
#ov.sidebar { inset: 0 auto 0 0; width: var(--sidebar-w);
  box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .35); }

#ov-grid { display: grid; gap: 18px; padding: 22px; }
#ov.grid #ov-grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
#ov.sidebar #ov-grid { grid-template-columns: 1fr; gap: 12px; padding: 14px; }

/* the sidebar docks: the presented slide slides over to make room */
body.ov-sidebar .slide.is-current { inset: 0 0 0 var(--sidebar-w); }

/* drag handle on the sidebar's right edge (shown by JS in sidebar mode) */
#ov-resizer { position: fixed; top: 0; height: 100%; width: 10px;
  left: calc(var(--sidebar-w) - 5px); z-index: 51; cursor: ew-resize; display: none; }
body.ov-resizing { cursor: ew-resize; user-select: none; }

.thumb { position: relative; border: 3px solid transparent; border-radius: 9px;
  overflow: hidden; cursor: pointer; background: var(--bg); aspect-ratio: 16 / 9;
  box-shadow: 0 2px 10px rgba(0, 0, 0, .35); }
.thumb svg { width: 100%; height: 100%; }
.thumb.cur { outline: 3px solid #e0b070; outline-offset: -3px; }
.thumb.sel { border-color: #6cb6ff; }
.thumb .n { position: absolute; left: 8px; bottom: 6px; font: 600 13px system-ui, sans-serif;
  color: #fff; background: rgba(0, 0, 0, .55); padding: 1px 8px; border-radius: 10px; }

/* --- print / PDF: one fully-revealed slide per page ------------------------ */
@media print {
  html, body { overflow: visible; height: auto; }
  #ov, #nav, #progress { display: none !important; }
  .slide { display: flex !important; position: relative; inset: auto;
    opacity: 1 !important; visibility: visible !important; transform: none !important;
    width: 100%; height: 100vh; break-after: page; page-break-after: always; }
  [data-step] { opacity: 1 !important; transform: none !important; }   /* final state per slide: */
  [data-final="0"] { opacity: 0 !important; }                          /* …minus what is gone by then */
}

/* --- live shaders (`!shader`, svg/shader.js) ------------------------------- */
.lmr-shader-box, .lmr-compute-box { width: 100%; height: 100%; position: relative; overflow: hidden; background: #05070d; }
.lmr-shader-canvas, .lmr-shader-poster { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.lmr-shader-error { position: absolute; inset: 0; margin: 0; padding: 1.2em; overflow: auto;
  font: 14px/1.4 ui-monospace, monospace; color: #ffd0d0; background: #2a0d12; white-space: pre-wrap; }
#lmr-toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 50;
  font: 600 15px system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.6); padding: 6px 14px;
  border-radius: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; }
#lmr-toast.on { opacity: 1; }
</style>
</head>

<script>/* World shapes for lemur SVG decks — the twin of lemur/anim/world.py (keep the
 * two in step; tests/python/test_anim.py runs both on the same cases).
 *
 * A 3-D shape made through a lemur.anim View ships its world geometry and a
 * rule; the !anim player (runtime.js) projects it with its view's camera at
 * time t: `poly` (rules cull / vis / hid), `anchor` (a 2-D outline placed at a
 * projected point; hide / ghost), `limb` / `base` (the occluder's outline).
 * Inlined only into decks that have world shapes. */
(function () {
  function fnum(x) { return Math.round(x * 10000) / 10000; }
  var LMRW = {
    toward: function (c) {
      return [-Math.sin(c.a) * Math.cos(c.e), -Math.cos(c.a) * Math.cos(c.e), Math.sin(c.e)];
    },
    project: function (c, x, y, z) {

      var ca = Math.cos(c.a), sa = Math.sin(c.a), se = Math.sin(c.e), ce = Math.cos(c.e);
      var sx = ca * x - sa * y, sy = (sa * x + ca * y) * se + z * ce;
      if (c.p !== null && c.p !== undefined) {
        var dc = z * se - (sa * x + ca * y) * ce, k = c.p / Math.max(c.p - dc, 1e-3);
        sx *= k; sy *= k;
      }
      return [sx * c.s + c.c[0], sy * c.s + c.c[1]];
    },
    occludes: function (occ, c, x, y, z) {
      if (!occ) return false;
      var d = LMRW.toward(c), R = occ.R;
      x -= occ.c[0]; y -= occ.c[1]; z -= occ.c[2];
      var b = x * d[0] + y * d[1] + z * d[2], disc = b * b - (x * x + y * y + z * z - R * R);
      if (disc <= 0) return false;
      var rt = Math.sqrt(disc), ss = [-b - rt, -b + rt];   // 1e-2: world.SURFACE_EPS
      for (var i = 0; i < 2; i++) {
        var s = ss[i];

                              z + s * d[2] + occ.c[2] >= occ.cap - 1e-6)) return true;
      }

    },
    runs: function (flags, closed) {

      if (!n) return out;
      var all = true, none = true;
      for (i = 0; i < n; i++) { if (flags[i]) none = false; else all = false; }
      if (all || none) {
        var idx = []; for (i = 0; i < n; i++) idx.push(i);

    split: function (occ, c, P, off, n, closed, want) {

        g.setAttribute('opacity', g.getAttribute('data-final') === '0' ? '0' : '1');
      });
      PLUGINS.forEach(function (p) { if (p.thumb) p.thumb(svg, i); });
      t.appendChild(svg);
      var n = document.createElement('div');
      n.className = 'n';
      n.textContent = (i + 1);
      t.appendChild(n);
      t.addEventListener('click', function (e) { e.stopPropagation(); pick(i); });
      grid.appendChild(t);
    });
    ov.appendChild(grid);
    ov.addEventListener('click', function (e) { e.stopPropagation(); closeOverview(); });
    document.body.appendChild(ov);
    wireResizer();
  }

  function openOverview(m) {
    if (!ov) buildOverview();
    mode = m;
    sel = cur;
    ov.className = m;                 // 'grid' | 'sidebar'
    ov.style.display = 'block';
    resizer.style.display = (m === 'sidebar') ? 'block' : 'none';
    document.body.classList.toggle('ov-sidebar', m === 'sidebar');
    ov.querySelectorAll('.thumb').forEach(function (t, i) { t.classList.toggle('cur', i === cur); });
    updateSel();
  }
  function closeOverview() {
    if (!ov) return;
    ov.style.display = 'none';
    if (resizer) resizer.style.display = 'none';
    mode = null;
    document.body.classList.remove('ov-sidebar');
  }
  function pick(i) { closeOverview(); go(i, 0); }

  function updateSel() {
    var thumbs = ov.querySelectorAll('.thumb');
    thumbs.forEach(function (t, i) { t.classList.toggle('sel', i === sel); });
    if (thumbs[sel]) thumbs[sel].scrollIntoView({ block: 'nearest' });
  }

  /* Move the grid selection to the geometrically-nearest thumb (like the old
   * viewer's slide sorter). */
  function gridMove(key) {
    var thumbs = [].slice.call(ov.querySelectorAll('.thumb'));
    var c = thumbs[sel];
    if (!c) return;
    var cr = c.getBoundingClientRect(), cx = cr.left + cr.width / 2, cy = cr.top + cr.height / 2;
    var horiz = key === 'ArrowRight' || key === 'ArrowLeft';
    var best = -1, score = Infinity;
    thumbs.forEach(function (t, i) {
      if (i === sel) return;
      var r = t.getBoundingClientRect(), dx = r.left + r.width / 2 - cx, dy = r.top + r.height / 2 - cy;
      if (key === 'ArrowRight' && dx <= 1) return;
      if (key === 'ArrowLeft' && dx >= -1) return;
      if (key === 'ArrowDown' && dy <= 1) return;
      if (key === 'ArrowUp' && dy >= -1) return;
      var along = horiz ? Math.abs(dx) : Math.abs(dy);
      var cross = horiz ? Math.abs(dy) : Math.abs(dx);
      var sc = along + cross * 3;    // prefer the same row/column
      if (sc < score) { score = sc; best = i; }
    });
    if (best >= 0) { sel = best; updateSel(); }
  }

  addEventListener('keydown', function (ev) {
    if (!mode && PLUGINS.some(function (p) { return p.key && p.key(ev); })) return;
    if (mode) {
      switch (ev.key) {
        case 'ArrowRight': case 'ArrowLeft': case 'ArrowUp': case 'ArrowDown':
          ev.preventDefault(); gridMove(ev.key); return;
        case 'Home': sel = 0; updateSel(); return;
        case 'End': sel = slides.length - 1; updateSel(); return;
        case 'Enter': case ' ': ev.preventDefault(); pick(sel); return;
        case 'o': case 'O': case 'Escape': ev.preventDefault(); closeOverview(); return;
        default: return;
      }
    }
    switch (ev.key) {
      case ' ': case 'ArrowRight': case 'PageDown': ev.preventDefault(); fwd(); break;
      case 'ArrowLeft': case 'PageUp': ev.preventDefault(); back(); break;
      case 'ArrowDown': ev.preventDefault(); go(cur + 1, 0); break;
      case 'ArrowUp': ev.preventDefault(); go(cur - 1, 0); break;
      case 'Home': ev.preventDefault(); go(0, 0); break;
      case 'End': ev.preventDefault(); go(slides.length - 1, maxOf(slides.length - 1)); break;
      case 'o': ev.preventDefault(); openOverview('grid'); break;
      case 'O': ev.preventDefault(); openOverview('sidebar'); break;
    }
  });
  document.addEventListener('click', function () { if (!mode) fwd(); });
  var wheelAt = 0;                                  // throttle: one notch = one step
  addEventListener('wheel', function (ev) {
    if (mode || ev.ctrlKey || ev.metaKey || !ev.deltaY) return;   // let the overview scroll
    ev.preventDefault();
    var now = Date.now();
    if (now - wheelAt < 120) return;
    wheelAt = now;
    if (ev.deltaY > 0) fwd(); else back();
  }, { passive: false });
  if (nav) {
    var stop = function (fn) {
      return function (ev) { ev.stopPropagation(); ev.preventDefault(); fn(); };
    };
    nav.querySelector('.nav-prev').addEventListener('click', stop(back));
    nav.querySelector('.nav-next').addEventListener('click', stop(fwd));
  }
  addEventListener('hashchange', function () { if (fromHash()) render(); });

  fromHash();   // deep-link: #/<slide>[/<step>] or #/<label>
  render();
})();
</script>
</body>
</html>
